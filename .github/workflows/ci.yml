name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arch-build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git base-devel cmake ninja qt6-base qt6-imageformats

      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build -LE benchmark --output-on-failure

      - name: Benchmark
        run: ctest --test-dir build -L benchmark --verbose

      - name: Validate Arch package recipe
        run: bash -n packaging/arch/PKGBUILD
