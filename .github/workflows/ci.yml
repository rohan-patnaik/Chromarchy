name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arch-build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git base-devel cmake ninja qt6-base qt6-imageformats

      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build -LE benchmark --output-on-failure

      - name: Benchmark
        run: ctest --test-dir build -L benchmark --verbose

      - name: Build and verify Arch package
        run: |
          useradd --create-home package-builder
          chown -R package-builder:package-builder packaging/arch
          runuser -u package-builder -- sh -c \
            'cd packaging/arch && makepkg --cleanbuild --clean --noconfirm'
          package_count=$(find packaging/arch -maxdepth 1 -type f \
            -name 'chromarchy-git-*.pkg.tar.zst' ! -name '*-debug-*' | wc -l)
          test "$package_count" -eq 1
          package_path=$(find packaging/arch -maxdepth 1 -type f \
            -name 'chromarchy-git-*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)
          pacman -Qip "$package_path"
          pacman -U --noconfirm "$package_path"
          test -x /usr/bin/chromarchy
          pacman -Q chromarchy-git
