name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arch-build:
    runs-on: ubuntu-latest
    container: archlinux@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        timeout-minutes: 10
        run: timeout 9m pacman -Syu --noconfirm --needed git base-devel cmake ninja python qt6-base qt6-imageformats

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          fetch-depth: 0

      - name: Validate offline capability catalog
        timeout-minutes: 2
        env:
          CHROMARCHY_ID_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: timeout 1m python scripts/generate_offline_parity.py --check

      - name: Configure
        timeout-minutes: 5
        run: timeout 4m cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        timeout-minutes: 10
        run: timeout 9m cmake --build build --parallel 2

      - name: Test
        timeout-minutes: 5
        run: timeout 4m ctest --test-dir build -LE benchmark --output-on-failure

      - name: Benchmark
        timeout-minutes: 10
        run: timeout 9m ctest --test-dir build -L benchmark --verbose

      - name: Build and verify Arch package
        timeout-minutes: 25
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_root=$(mktemp -d)
          mkdir "$source_root/Chromarchy"
          git archive "$GITHUB_SHA" | tar -x -C "$source_root/Chromarchy"
          printf '%s\n' "$GITHUB_SHA" > \
            "$source_root/Chromarchy/.chromarchy-source-revision"
          source_archive="chromarchy-source-$GITHUB_SHA.tar.gz"
          tar -C "$source_root" -czf "packaging/arch/$source_archive" Chromarchy
          source_b2sum=$(b2sum "packaging/arch/$source_archive" | cut -d' ' -f1)
          useradd --create-home package-builder
          chown -R package-builder:package-builder packaging/arch
          runuser -u package-builder -- env \
            CHROMARCHY_SOURCE_ARCHIVE="$source_archive" \
            CHROMARCHY_SOURCE_B2SUM="$source_b2sum" \
            CHROMARCHY_EXPECTED_REVISION="$GITHUB_SHA" sh -c \
            'cd packaging/arch && timeout 20m makepkg --cleanbuild --clean --noconfirm'
          package_count=$(find packaging/arch -maxdepth 1 -type f \
            -name 'chromarchy-git-*.pkg.tar.zst' ! -name '*-debug-*' | wc -l)
          test "$package_count" -eq 1
          package_path=$(find packaging/arch -maxdepth 1 -type f \
            -name 'chromarchy-git-*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)
          package_info=$(pacman -Qip "$package_path")
          printf '%s\n' "$package_info"
          package_version=$(printf '%s\n' "$package_info" | \
            sed -n 's/^Version *: *//p')
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          test "$package_version" = "0.1.0.r0.g$short_sha-1"
          pacman -U --noconfirm "$package_path"
          test -x /usr/bin/chromarchy
          pacman -Q chromarchy-git
